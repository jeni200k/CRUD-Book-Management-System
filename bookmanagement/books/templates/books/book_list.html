<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
</head>
<body>
    <h1>Book Management System</h1>

    <a href="{% url 'add_book' %}">Add New Book</a>

    <table border="1" cellpadding="10">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'update_book' book.id %}">
                    Update Price
                </a>

                <form action="{% url 'delete_book' book.id %}"
                      method="post">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
